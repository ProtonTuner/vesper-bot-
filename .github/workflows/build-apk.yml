name: Build Vesper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project ZIP
        run: test -f vesper_android_v1_0_project.zip

      - name: Extract Android project
        run: unzip -q vesper_android_v1_0_project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: vesper_android_v1_0
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vesper-android-debug-apk
          path: vesper_android_v1_0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
