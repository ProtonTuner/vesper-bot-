
name: Build Vesper APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extraer proyecto Android
        run: |
          unzip -o vesper_android_ui_refresh.zip -d .
          test -f vesper_android_v1_0/settings.gradle.kts

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        working-directory: vesper_android_v1_0
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: vesper-android-debug-apk
          path: vesper_android_v1_0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
